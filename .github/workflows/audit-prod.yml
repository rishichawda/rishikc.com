name: Production audit

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    name: Audit rishikc.com
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout (no submodules, no token)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install dependencies without running install scripts
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Run axe on the live site
        run: yarn audit:a11y
        env:
          BASE_URL: https://rishikc.com
          REPORT_DIR: audit-reports/a11y
      - name: Run Lighthouse on the live site
        if: ${{ !cancelled() }}
        run: yarn audit:lighthouse
        env:
          BASE_URL: https://rishikc.com
          REPORT_DIR: audit-reports/lighthouse
          # Nobody reads a warning in a scheduled run, so a missed budget fails it here.
          FAIL_ON_BUDGET_MISS: 'true'
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prod-audit-report
          path: audit-reports
          retention-days: 30
