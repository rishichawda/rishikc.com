name: Production audit

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    name: Audit rishikc.com
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (no submodules, no token)
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies without running install scripts
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Run axe on the live site
        run: yarn audit:a11y
        env:
          BASE_URL: https://rishikc.com
          REPORT_DIR: audit-reports/a11y
      - name: Run Lighthouse on the live site
        if: ${{ !cancelled() }}
        run: yarn audit:lighthouse
        env:
          BASE_URL: https://rishikc.com
          REPORT_DIR: audit-reports/lighthouse
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: prod-audit-report
          path: audit-reports
          retention-days: 30
